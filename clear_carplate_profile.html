<!doctype html>
<meta charset="utf-8">
<title>Clear carplate profile images</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 32px;
    line-height: 1.5;
  }
  code {
    background: #f2f2f2;
    padding: 2px 5px;
    border-radius: 4px;
  }
</style>
<h1>Clear carplate profile images</h1>
<p id="status">Running...</p>
<script>
  const PROFILE_STORAGE_KEY = "plonkit-profiles-v1";
  const SELECTION_STORAGE_KEY = "plonkit-image-selections-v1";
  const CARPLATE_PROFILE_CLEANUP_KEY = "plonkit-carplate-profile-images-cleared-v1";
  const TARGET_NAME = "车牌";
  const status = document.querySelector("#status");

  function setStatus(message) {
    status.textContent = message;
  }

  try {
    const raw = localStorage.getItem(PROFILE_STORAGE_KEY);
    if (!raw) {
      setStatus(`No ${PROFILE_STORAGE_KEY} value found for this browser origin.`);
    } else {
      const store = JSON.parse(raw);
      const profiles = store && store.profiles && typeof store.profiles === "object" ? store.profiles : {};
      const entry = Object.entries(profiles).find(([, profile]) => profile && profile.name === TARGET_NAME);

      if (!entry) {
        setStatus(`No profile named ${TARGET_NAME} found.`);
      } else {
        const [profileId, profile] = entry;
        const removedSlugCount = Object.keys(profile.selections || {}).length;
        profile.selections = {};
        profile.layoutCache = {};
        profile.renderCache = null;
        localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(store));

        if (store.activeProfileId === profileId) {
          localStorage.setItem(SELECTION_STORAGE_KEY, "{}");
        }
        localStorage.setItem(CARPLATE_PROFILE_CLEANUP_KEY, "1");

        setStatus(`Cleared image selections and image caches for ${TARGET_NAME} (${profileId}). Removed ${removedSlugCount} country/page selection entries.`);
      }
    }
  } catch (error) {
    setStatus(`Failed: ${error && error.message ? error.message : String(error)}`);
  }
</script>
