<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>geoguessr-map</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8eef7;
      --muted: #9fb0c5;
      --line: rgba(3, 8, 15, 0.72);
      --ocean: #07111d;
      --land: #263448;
      --target: #ef4444;
      --target-faded: #9b3f47;
      --left-drive: #3b82f6;
      --left-drive-faded: #3567a8;
      --selected: #ffd166;
      --panel: rgba(16, 25, 38, 0.62);
      --panel-strong: rgba(16, 25, 38, 0.82);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-strong: rgba(255, 255, 255, 0.14);
      --border: rgba(195, 215, 238, 0.22);
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(31, 111, 235, 0.18), transparent 28%),
        radial-gradient(circle at 82% 6%, rgba(215, 47, 47, 0.16), transparent 24%),
        linear-gradient(135deg, #06101c 0%, #0c1522 48%, #111827 100%);
    }

    .shell {
      min-height: 100vh;
      display: block;
      padding: 0;
    }

    .map-wrap {
      position: fixed;
      inset: 0;
      padding: 0;
      min-width: 0;
    }

    .map-head {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: 0;
      padding: 10px 12px 10px 18px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(10, 18, 30, 0.54);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(22px) saturate(1.24);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .source {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .map-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .map-head-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .mobile-menu-toggle {
      display: none;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.11);
      color: var(--ink);
      font: 700 18px/1 Arial, sans-serif;
      cursor: pointer;
    }

    .zoom-controls {
      position: static;
      display: flex;
      gap: 6px;
      z-index: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    .zoom-controls button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.11);
      color: var(--ink);
      border-radius: 12px;
      font: 700 17px/1 Arial, sans-serif;
      cursor: pointer;
      box-shadow: none;
    }

    .zoom-controls button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    svg {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      display: block;
      background: var(--ocean);
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
    }

    .sphere {
      fill: var(--ocean);
    }

    .country-border {
      fill: none;
      stroke: rgba(216, 230, 248, 0.58);
      stroke-width: 0.52;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .map-render-layer {
      pointer-events: none;
    }

    .country-render-fill,
    .country-render-texture {
      stroke: none;
      pointer-events: none;
    }

    .country-render-texture {
      opacity: 0.62;
    }

    .border-layer {
      pointer-events: none;
    }

    .country-click-layer {
      pointer-events: all;
    }

    .country-click-target {
      fill: transparent;
      stroke: none;
      cursor: pointer;
      pointer-events: all;
    }

    .image-overlay {
      pointer-events: none;
    }

    .map-photo {
      pointer-events: none;
    }

    .map-photo image {
      pointer-events: none;
    }

    .profile-panel {
      position: static;
      z-index: auto;
      width: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .profile-title {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0;
      white-space: nowrap;
    }

    .profile-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 0;
    }

    .profile-button {
      min-width: 0;
      min-height: 34px;
      max-width: 82px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--ink);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: none;
    }

    .profile-button.active {
      border-color: rgba(255, 209, 102, 0.76);
      background: rgba(255, 209, 102, 0.18);
      color: #fff5d0;
    }

    .profile-settings {
      border-top: 0;
      padding-top: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .profile-settings label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    .profile-settings input[type="text"] {
      width: 128px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--ink);
      padding: 7px 9px;
      font: inherit;
      outline: none;
    }

    .profile-toggle {
      display: flex !important;
      grid-template-columns: none !important;
      align-items: center;
      gap: 8px !important;
      color: var(--ink) !important;
    }

    .profile-toggle input {
      margin: 0;
    }

    .profile-transfer {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .profile-transfer-button {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--ink);
      font: 700 19px/1 Arial, sans-serif;
      cursor: pointer;
    }

    .profile-transfer-button:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .profile-transfer-status {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      max-width: min(420px, calc(100vw - 32px));
      padding: 9px 12px;
      border: 1px solid rgba(122, 214, 156, 0.56);
      border-radius: 8px;
      background: rgba(16, 34, 27, 0.94);
      color: #d9ffe6;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .profile-transfer-status.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .profile-transfer-status.error {
      border-color: rgba(248, 113, 113, 0.62);
      background: rgba(57, 23, 27, 0.95);
      color: #ffe2e2;
    }

    .side {
      position: fixed;
      top: 92px;
      right: 16px;
      bottom: 16px;
      z-index: 4;
      width: 440px;
      border: 1px solid var(--border);
      background: rgba(10, 18, 30, 0.54);
      padding: 14px;
      overflow: auto;
      max-height: none;
      border-radius: 22px;
      box-shadow: 0 18px 56px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(22px) saturate(1.18);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 14px 0 16px;
    }

    .side > h2:first-child,
    .stats {
      display: none;
    }

    .stat {
      border: 1px solid var(--border);
      background: var(--glass);
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .legend {
      display: grid;
      gap: 8px;
      margin: 12px 0 16px;
      font-size: 13px;
      padding: 0 0 12px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      border-bottom: 1px solid var(--border);
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 22px;
    }

    .legend-note {
      margin: -2px 0 0 26px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .swatch {
      width: 18px;
      height: 12px;
      border: 1px solid var(--line);
      display: inline-block;
      background: var(--land);
      border-radius: 4px;
    }

    .swatch.red {
      background: var(--target);
    }

    .language-guide {
      margin: 12px 0 16px;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
      box-shadow: none;
      overflow: hidden;
    }

    .language-guide summary {
      padding: 0 0 10px;
      border-bottom: 1px solid var(--border);
      background: transparent;
    }

    .language-guide[open] summary {
      margin-bottom: 0;
    }

    .language-guide-list {
      display: grid;
      gap: 9px;
      padding: 10px 0 2px;
    }

    .language-item {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      font-size: 12px;
      line-height: 1.45;
    }

    .language-swatch {
      width: 42px;
      height: 24px;
      border: 1px solid var(--line);
      background: #f7d6d6;
      border-radius: 9px;
    }

    .language-title {
      font-weight: 700;
      color: var(--ink);
    }

    .language-mark {
      color: #cad5e4;
    }

    .language-hint {
      color: var(--muted);
    }

    h2 {
      margin: 18px 0 8px;
      font-size: 15px;
    }

    .doc-panel {
      border: 0;
      background: transparent;
      border-radius: 0;
      min-height: 320px;
      padding: 0;
      box-shadow: none;
    }

    .selection-tools {
      display: grid;
      gap: 8px;
      margin: 0 0 14px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    #save-selections,
    #download-selections,
    #selection-status,
    .selection-tools p {
      display: none !important;
    }

    .selection-tools p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .selection-tools button {
      justify-self: start;
      border: 1px solid var(--line);
      background: rgba(232, 238, 247, 0.14);
      color: #fff;
      border-radius: 12px;
      padding: 7px 10px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .selection-status {
      color: #84e1a4;
      font-size: 12px;
      min-height: 16px;
    }

    .fade-toggle {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 8px;
    }

    .fade-toggle input {
      margin: 0;
    }

    .placeholder {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .doc-title {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.25;
    }

    .doc-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
    }

    .page-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 12px;
    }

    .page-tabs button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 8px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .page-tabs button.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.34);
    }

    .article {
      font-size: 14px;
      line-height: 1.72;
      overflow-wrap: anywhere;
    }

    .article h1,
    .article h2,
    .article h3,
    .article h4 {
      line-height: 1.3;
      margin: 18px 0 8px;
    }

    .article p {
      margin: 8px 0;
    }

    .article img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 8px auto;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 14px;
    }

    .article figure {
      position: relative;
      margin: 12px 0;
    }

    .image-choice {
      position: relative;
      border: 1px solid transparent;
      border-radius: 6px;
      padding-top: 30px;
    }

    .image-choice.selected-image {
      border-color: var(--selected);
      background: rgba(255, 209, 102, 0.12);
    }

    .image-picker {
      position: absolute;
      top: 4px;
      left: 6px;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(10, 18, 30, 0.82);
      font-size: 12px;
      color: var(--ink);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
    }

    .image-picker input {
      margin: 0;
    }

    .image-rank {
      min-width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    .article table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13px;
    }

    .article th,
    .article td {
      border: 1px solid var(--border);
      padding: 6px;
      vertical-align: top;
    }

    .article th {
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
    }

    details {
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .side > details:not(.language-guide) {
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 10px 0 0;
      box-shadow: none;
      overflow: hidden;
    }

    .political-disclaimer {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 209, 102, 0.28);
      border-radius: 14px;
      background: rgba(255, 209, 102, 0.08);
    }

    .political-disclaimer p {
      margin: 8px 0 0;
      color: #d9e4f2;
      font-size: 12px;
      line-height: 1.65;
    }

    .political-note {
      margin: 10px 0;
      padding: 9px 10px;
      border: 1px solid rgba(255, 209, 102, 0.24);
      border-radius: 12px;
      background: rgba(255, 209, 102, 0.08);
      color: #d9e4f2;
      font-size: 12px;
      line-height: 1.6;
    }

    summary {
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      color: var(--ink);
    }

    ul {
      margin: 0;
      padding-left: 18px;
    }

    li {
      margin: 4px 0;
      font-size: 13px;
      color: #d9e4f2;
    }

    .menu-list {
      columns: 2;
      column-gap: 18px;
      margin-top: 10px;
    }

    .menu-list li {
      break-inside: avoid;
    }

    @media (max-width: 980px) {
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .shell {
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 0;
        padding: 0;
        gap: 0;
      }

      .map-wrap {
        position: relative;
        inset: auto;
        width: auto;
        height: auto;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .map-head {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 8px;
        align-items: center;
        gap: 8px;
        padding: 7px 8px 7px 12px;
        border-radius: 14px;
      }

      .map-head h1 {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 16px;
      }

      .map-toolbar {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        display: none;
        min-width: 0;
        padding: 10px;
        overflow: auto;
        justify-content: flex-start;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(10, 18, 30, 0.96);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.48);
        backdrop-filter: blur(22px) saturate(1.2);
      }

      .map-head.menu-open .map-toolbar {
        display: block;
      }

      .mobile-menu-toggle {
        display: grid;
        place-items: center;
      }

      .profile-panel {
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 8px;
      }

      .profile-settings {
        width: 100%;
        flex-wrap: wrap;
      }

      .profile-settings input[type="text"] {
        width: min(128px, 32vw);
      }

      .side {
        position: relative;
        inset: auto;
        z-index: 4;
        display: flex;
        flex-direction: column;
        width: auto;
        height: auto;
        min-width: 0;
        min-height: 0;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 0;
        max-height: none;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      .doc-panel {
        order: -1;
        min-height: 0;
      }

      .article {
        font-size: 14px;
        line-height: 1.65;
      }

      .menu-list {
        columns: 1;
      }

      .menu-list li {
        margin-bottom: 6px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      svg {
        width: 100%;
        height: 100%;
        min-height: 0;
      }
    }

    @media (max-width: 980px) and (orientation: portrait) {
      .shell {
        grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-columns: minmax(0, 1fr);
      }

      .map-wrap {
        grid-row: 1;
      }

      .side {
        grid-row: 2;
        border-width: 1px 0 0;
      }

      .map-toolbar {
        max-height: calc(50dvh - 70px);
      }
    }

    @media (max-width: 980px) and (orientation: landscape) {
      .shell {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
      }

      .map-wrap {
        grid-column: 1;
      }

      .side {
        grid-column: 2;
        border-width: 0 0 0 1px;
      }

      .map-toolbar {
        max-height: calc(100dvh - 70px);
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="map-wrap">
      <div class="map-head">
        <h1>geoguessr-map</h1>
        <div class="map-toolbar" id="map-toolbar">
          <div class="profile-panel" id="profile-panel" aria-label="Profiles">
            <div class="profile-title">Profiles</div>
            <div class="profile-buttons" id="profile-buttons"></div>
            <div class="profile-settings">
              <label>
                <span>Profile 名称</span>
                <input type="text" id="profile-name" maxlength="28">
              </label>
              <label class="profile-toggle">
                <input type="checkbox" id="profile-show-language">
                <span>语言形状</span>
              </label>
              <label class="profile-toggle">
                <input type="checkbox" id="profile-show-left-drive">
                <span>左右行颜色</span>
              </label>
            </div>
            <div class="profile-transfer">
              <button type="button" class="profile-transfer-button" id="download-profiles" title="下载全部 Profile" aria-label="下载全部 Profile">⇩</button>
              <button type="button" class="profile-transfer-button" id="upload-profiles" title="导入全部 Profile" aria-label="导入全部 Profile">⇧</button>
              <input type="file" id="profile-file-input" accept="application/json,.json" hidden>
            </div>
          </div>
        </div>
        <div class="map-head-actions">
          <div class="zoom-controls" aria-label="地图缩放控件">
            <button type="button" id="zoom-in" title="放大" aria-label="放大">+</button>
            <button type="button" id="zoom-out" title="缩小" aria-label="缩小">−</button>
            <button type="button" id="zoom-reset" title="重置" aria-label="重置地图缩放">↺</button>
          </div>

      GTM: ["iberian"], GUM: ["english", "pacific_creole"], HKG: ["chinese", "english"],
      HRV: ["slavic_other"], HUN: ["baltic_finnic"], IDN: ["southeast_asian"], IMN: ["english"],
      IND: ["south_asian", "english"], IOA: ["english"], IOT: ["english"], IRL: ["english"],
      IRQ: ["arabic_middle_east"], ISL: ["nordic"], ISR: ["arabic_middle_east"], ITA: ["italian"],
      JEY: ["english", "french"], JOR: ["arabic_middle_east"], JPN: ["japanese"],
      KAZ: ["turkic_central_asia", "russian"], KEN: ["english", "african_local"],
      KGZ: ["turkic_central_asia", "russian"], KHM: ["southeast_asian"], KOR: ["korean"],
      LAO: ["southeast_asian"], LBN: ["arabic_middle_east", "french"], LIE: ["german"],
      LKA: ["south_asian"], LSO: ["african_local", "english"], LTU: ["baltic_finnic"],
      LUX: ["french", "german"], LVA: ["baltic_finnic"], MAC: ["chinese", "iberian"],
      MCO: ["french"], MDG: ["african_local", "french"], MEX: ["iberian"], MKD: ["slavic_other"],
      MLI: ["french", "african_local"], MLT: ["arabic_middle_east", "english"], MNE: ["slavic_other"],
      MNG: ["turkic_central_asia", "russian"], MNP: ["english", "pacific_creole"],
      MYS: ["southeast_asian", "english"], NAM: ["english", "african_local", "german"],
      NGA: ["english", "african_local"], NLD: ["dutch_lowland"], NOR: ["nordic"],
      NPL: ["south_asian"], NZL: ["english", "pacific_creole"], OMN: ["arabic_middle_east"],
      PAK: ["south_asian", "english"], PAN: ["iberian"], PCN: ["english", "pacific_creole"],
      PER: ["iberian"], PHL: ["southeast_asian", "english"], POL: ["slavic_other"],
      PRI: ["iberian", "english"], PRT: ["iberian"], QAT: ["arabic_middle_east"],
      ROU: ["balkan_greek"], RUS: ["russian"], RWA: ["african_local", "english", "french"],
      SEN: ["french", "african_local"], SGP: ["english", "southeast_asian", "chinese"],
      SGS: ["english"], SMR: ["italian"], SPM: ["french"], SRB: ["slavic_other"],
      STP: ["iberian"], SVK: ["slavic_other"], SVN: ["slavic_other"], SWE: ["nordic"],
      SWZ: ["african_local", "english"], THA: ["southeast_asian"], TUN: ["arabic_middle_east", "french"],
      TUR: ["turkic_central_asia"], TWN: ["chinese"], TZA: ["african_local", "english"],
      UGA: ["african_local", "english"], UKR: ["slavic_other", "russian"], URY: ["iberian"],
      USA: ["english", "iberian"], VIR: ["english"], VNM: ["southeast_asian"],
      VUT: ["pacific_creole", "english", "french"], ZAF: ["english", "african_local", "dutch_lowland"],
    };
    const state = {
      index: null,
      pages: null,
      pagesBySlug: new Map(),
      targetCodes: new Set(),
      imageSelections: {},
      profiles: null,
      activeProfileId: "profile1",
      fadedFeatures: new Set(),
      mapFeatures: [],
      featureById: new Map(),
      renderFillSelection: null,
      renderTextureSelection: null,
      borderPathSelection: null,
      clickPathSelection: null,
      path: null,
      projection: null,
      zoomTransform: d3.zoomIdentity,
      overlayLayer: null,
      imageUpdateFrame: 0,
      imageUpdateTimer: 0,
      layoutCacheDirty: false,
      renderCacheDirty: false,
      selectedImageFeatureCache: null,
      candidatePositionCache: new Map(),
      imageAspectRatios: new Map(),
      pendingAspectLoads: new Set(),
    };

    function featureCode(feature) {
      const p = feature.properties || {};
      if (p._codeOverride) return p._codeOverride;
      return [p.ADM0_A3, p.ISO_A3, p.GU_A3, p.SU_A3, p.BRK_A3, p.SOV_A3]
        .find(value => value && value !== "-99") || "";
    }

    function featureCodeCandidates(feature) {
      const p = feature.properties || {};
      const candidates = [
        p._codeOverride,
        p.ADM0_A3,
        p.ISO_A3,
        p.GU_A3,
        p.SU_A3,
        p.BRK_A3,
        p.SOV_A3,
        p.ADM0_A3_US,
        p.ADM0_A3_CN,
        p.ADM0_A3_IN,
      ];
      if (p._featureIdOverride && String(p._featureIdOverride).includes(":")) {
        candidates.push(String(p._featureIdOverride).split(":")[0]);
      }
      const seen = new Set();
      return candidates
        .map(value => String(value || ""))
        .filter(value => value && value !== "-99" && !seen.has(value) && seen.add(value));
    }

    function featureId(feature) {
      if ((feature.properties || {})._featureIdOverride) return feature.properties._featureIdOverride;
      return String((feature.properties || {}).NE_ID || "");
    }

    function featureFadeKey(feature) {
      return featureId(feature) || featureCode(feature) || featureName(feature);
    }

    function safeSvgId(value) {
      return String(value || "feature").replace(/[^a-zA-Z0-9_-]/g, "-");
    }

    function clipIdForFeature(feature) {
      return `clip-${safeSvgId(featureId(feature) || featureCode(feature) || featureName(feature))}`;
    }

    function featureName(feature) {
      const p = feature.properties || {};
      if (p._displayName) return p._displayName;
      return p.NAME_ZH || p.NAME_ZHT || p.NAME_EN || p.NAME || p.ADMIN || "未知地区";
    }

    function politicalDisplayKey(feature) {
      const p = feature.properties || {};
      const code = featureCode(feature);
      if (code === "PSX" && p.NAME_EN) return `${code}:${p.NAME_EN}`;
      return code;
    }

    function applyPoliticalOverrides(features) {
      for (const feature of features) {
        const p = feature.properties || (feature.properties = {});
        const displayName = POLITICAL_DISPLAY_NAMES.get(politicalDisplayKey(feature));
        if (displayName) p._displayName = displayName;
        if (featureCode(feature) === "ISR" || featureCode(feature) === "PSX") {
          p._politicalNotice = "巴以相关地图面统一按地区口径展示，仅用于街景识别参考，不表达主权或边界立场。";
        }
      }
      return features;
    }

    function replacePoliticalText(text) {
      return String(text || "")
        .replace(/中华民国/g, "中国台湾")
        .replace(/(^|[^中国])台湾/g, "$1中国台湾")
        .replace(/(^|[^中国])香港/g, "$1中国香港")
        .replace(/(^|[^中国])澳门/g, "$1中国澳门")
        .replace(/以色列/g, "巴以地区")
        .replace(/巴勒斯坦/g, "巴以地区")
        .replace(/\bIsrael\b/g, "巴以地区")
        .replace(/\bPalestine\b/g, "巴以地区")
        .replace(/\bWest Bank\b/g, "约旦河西岸地区")
        .replace(/\bGaza\b/g, "加沙地区");
    }

    function displayPageTitle(page) {
      if (!page) return "";
      return replacePoliticalText(page.title || "");
    }

    function applyPoliticalTextPolicy(root) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        node.nodeValue = replacePoliticalText(node.nodeValue);
      });
    }

    function polygonBounds(polygon) {
      let minX = Infinity;
      let maxX = -Infinity;
      let minY = Infinity;
      let maxY = -Infinity;
      for (const ring of polygon) {
        for (const [x, y] of ring) {
          minX = Math.min(minX, x);
          maxX = Math.max(maxX, x);
          minY = Math.min(minY, y);
          maxY = Math.max(maxY, y);
        }
      }
      return { minX, maxX, minY, maxY };
    }

    function isAlaskaPolygon(polygon) {
      const bounds = polygonBounds(polygon);
      return bounds.maxY > 50 && (bounds.minX < -128 || bounds.maxX > 170);
    }

    function isHawaiiPolygon(polygon) {
      const bounds = polygonBounds(polygon);
      return bounds.minY > 18 && bounds.maxY < 24 && bounds.minX > -162 && bounds.maxX < -154;
    }

    function cloneFeatureWithPolygons(feature, polygons, overrides) {
      return {
        type: "Feature",
        properties: { ...feature.properties, ...overrides },
        geometry: {
          type: polygons.length === 1 ? "Polygon" : "MultiPolygon",
          coordinates: polygons.length === 1 ? polygons[0] : polygons,
        },
      };
    }

    function splitFeature(feature) {
      if (featureCode(feature) !== "USA" || feature.geometry?.type !== "MultiPolygon") return [feature];
      const alaska = [];
      const hawaii = [];
      const rest = [];

      for (const polygon of feature.geometry.coordinates) {
        if (isAlaskaPolygon(polygon)) alaska.push(polygon);
        else if (isHawaiiPolygon(polygon)) hawaii.push(polygon);
        else rest.push(polygon);
      }

      const split = [];
      if (rest.length) {
        split.push(cloneFeatureWithPolygons(feature, rest, {
          _region: "usa-rest",
          _featureIdOverride: `${feature.properties.NE_ID}:rest`,
          _displayName: "美国",
        }));
      }
      if (hawaii.length) {
        split.push(cloneFeatureWithPolygons(feature, hawaii, {
          _region: "hawaii",
          _featureIdOverride: `${feature.properties.NE_ID}:hawaii`,
          _displayName: "夏威夷",
        }));
      }
      if (alaska.length) {
        split.push(cloneFeatureWithPolygons(feature, alaska, {
          _region: "alaska",
          _codeOverride: "USA_ALASKA",
          _featureIdOverride: `${feature.properties.NE_ID}:alaska`,
          _displayName: "阿拉斯加",
        }));
      }
      return split;
    }

    function polygonsFromFeature(feature) {
      if (feature.geometry?.type === "Polygon") return [feature.geometry.coordinates];
      if (feature.geometry?.type === "MultiPolygon") return feature.geometry.coordinates;
      return [];
    }

    function normalizedFillFeature(feature) {
      const polygons = polygonsFromFeature(feature).map(polygon => {
        const polygonFeature = { type: "Polygon", coordinates: polygon };
        if (d3.geoArea(polygonFeature) <= 2 * Math.PI) return polygon;
        return polygon.map(ring => [...ring].reverse());
      });
      return {
        type: "Feature",
        properties: feature.properties || {},
        geometry: {
          type: polygons.length === 1 ? "Polygon" : "MultiPolygon",
          coordinates: polygons.length === 1 ? polygons[0] : polygons,
        },
      };
    }

    function countryMergeKey(feature) {
      const p = feature.properties || {};
      if (p._region) return featureId(feature) || `${featureCode(feature)}:${p._region}`;
      return featureCode(feature) || featureId(feature) || featureName(feature);
    }

    function mergedCountryName(code, features) {
      const counts = new Map();
      const add = value => {
        if (!value || value === "-99") return;
        counts.set(value, (counts.get(value) || 0) + 1);
      };
      features.forEach(feature => {
        const p = feature.properties || {};
        add(p.ADMIN);
        add(p.SOVEREIGNT);
        add(p.NAME_EN);
        add(p.NAME);
      });
      return [...counts.entries()]
        .sort((a, b) => b[1] - a[1] || a[0].length - b[0].length)[0]?.[0] || code;
    }

    function mergeCountryFeatures(features) {
      const groups = new Map();
      for (const feature of features) {
        const key = countryMergeKey(feature);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(feature);
      }

      return [...groups.values()].map(group => {
        if (group.length <= 1) return group[0];
        const template = group[0];
        const code = featureCode(template);
        const name = mergedCountryName(code, group);
        const polygons = group.flatMap(polygonsFromFeature);
        return {
          type: "Feature",
          properties: {
            ...(template.properties || {}),
            _codeOverride: code,
            _featureIdOverride: `${code}:country`,
            _displayName: name,
            NAME: name,
            NAME_EN: name,
            ADMIN: name,
            GEOUNIT: name,
            GU_A3: code,
            SUBUNIT: name,
            SU_A3: code,
          },
          geometry: {
            type: polygons.length === 1 ? "Polygon" : "MultiPolygon",
            coordinates: polygons.length === 1 ? polygons[0] : polygons,
          },
        };
      });
    }

    function displayTargetCodes(index) {
      const codes = new Set(index.redCodes);
      codes.delete("CHN");
      return codes;
    }

    function hasFeaturePage(feature) {
      if ((feature.properties || {})._noPage) return false;
      return slugsForFeature(feature).length > 0;
    }

    function isRedFeature(feature) {
      const p = feature.properties || {};
      if (p._region === "alaska") return false;
      if (!hasFeaturePage(feature)) return false;
      const code = featureCode(feature);
      if (code === "CHN") return false;
      return true;
    }

    function isLeftDriveFeature(feature) {
      return activeProfile().showLeftDriveColors !== false && isRedFeature(feature) && LEFT_DRIVE_CODES.has(featureCode(feature));
    }

    function isRelaxedImageFeature(feature) {
      return RELAXED_IMAGE_CODES.has(featureCode(feature));
    }

    function countryRenderFill(feature) {
      if (!isRedFeature(feature)) return "transparent";
      const faded = state.fadedFeatures.has(featureFadeKey(feature));
      if (isLeftDriveFeature(feature)) return faded ? "var(--left-drive-faded)" : "var(--left-drive)";
      return faded ? "var(--target-faded)" : "var(--target)";
    }

    function languagePatternId(languageId) {
      return `language-pattern-${safeSvgId(languageId)}`;
    }

    function countryRenderTexture(feature) {
      if (activeProfile().showLanguagePatterns === false) return "transparent";
      const languageId = languageIdsForFeature(feature)[0];
      return languageId ? `url(#${languagePatternId(languageId)})` : "transparent";
    }

    function updateCountryStyles() {
      if (state.renderFillSelection) {
        state.renderFillSelection.attr("fill", countryRenderFill);
      }
      if (state.renderTextureSelection) {
        state.renderTextureSelection.attr("fill", countryRenderTexture);
      }
      if (state.borderPathSelection) {
        state.borderPathSelection.attr("class", "country-border");
      }
    }

    function languageIdsForFeature(feature) {
      return (LANGUAGE_BY_CODE[featureCode(feature)] || []).slice(0, 3);
    }

    function languageLabelsForFeature(feature) {
      return languageIdsForFeature(feature)
        .map(id => LANGUAGE_GROUP_BY_ID.get(id)?.label)
        .filter(Boolean);
    }

    function guideSwatchStyle(group) {
      const pattern = group.pattern;
      if (!pattern) return "background:#fff";
      const color = pattern.color;
      const base = "rgba(255,255,255,0.74)";
      if (pattern.kind === "horizontal") return `background:repeating-linear-gradient(0deg,${base} 0 6px,${color} 6px 8px)`;
      if (pattern.kind === "vertical") return `background:repeating-linear-gradient(90deg,${base} 0 6px,${color} 6px 8px)`;
      if (pattern.kind === "diagonal") return `background:repeating-linear-gradient(135deg,${base} 0 7px,${color} 7px 9px)`;
      if (pattern.kind === "back_diagonal") return `background:repeating-linear-gradient(45deg,${base} 0 7px,${color} 7px 9px)`;
      if (pattern.kind === "checker") return `background-color:${base};background-image:linear-gradient(45deg,${color} 25%,transparent 25%),linear-gradient(-45deg,${color} 25%,transparent 25%),linear-gradient(45deg,transparent 75%,${color} 75%),linear-gradient(-45deg,transparent 75%,${color} 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0`;
      if (pattern.kind === "dots") return `background-color:${base};background-image:radial-gradient(${color} 2px,transparent 2.4px);background-size:10px 10px`;
      if (pattern.kind === "plus") return `background-color:${base};background-image:linear-gradient(${color} 2px,transparent 2px),linear-gradient(90deg,${color} 2px,transparent 2px);background-size:12px 12px;background-position:5px 5px`;
      if (pattern.kind === "nordic_cross") return `background-color:${base};background-image:linear-gradient(90deg,transparent 0 35%,${color} 35% 48%,transparent 48%),linear-gradient(0deg,transparent 0 38%,${color} 38% 52%,transparent 52%)`;
      if (pattern.kind === "triangles") return `background-color:${base};background-image:linear-gradient(60deg,transparent 45%,${color} 45% 55%,transparent 55%),linear-gradient(120deg,transparent 45%,${color} 45% 55%,transparent 55%);background-size:14px 14px`;
      if (pattern.kind === "diamonds" || pattern.kind === "diamond_grid") return `background-color:${base};background-image:linear-gradient(45deg,transparent 45%,${color} 45% 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,${color} 45% 55%,transparent 55%);background-size:14px 14px`;
      if (pattern.kind === "zigzag") return `background-color:${base};background-image:linear-gradient(135deg,${color} 15%,transparent 15%),linear-gradient(225deg,${color} 15%,transparent 15%);background-size:12px 12px`;
      if (pattern.kind === "crosses") return `background-color:${base};background-image:linear-gradient(45deg,transparent 42%,${color} 42% 54%,transparent 54%),linear-gradient(-45deg,transparent 42%,${color} 42% 54%,transparent 54%);background-size:13px 13px`;
      if (pattern.kind === "wave" || pattern.kind === "waves" || pattern.kind === "arc" || pattern.kind === "meander") {
        return `background-color:${base};background-image:repeating-linear-gradient(135deg,transparent 0 8px,${color} 8px 10px,transparent 10px 16px)`;
      }
      return `background:${base}`;
    }

    function createLanguagePatterns(defs) {
      const patternSelection = defs
        .selectAll("pattern.language-pattern")
        .data(LANGUAGE_GROUPS.filter(group => group.pattern), group => group.id)
        .join("pattern")
        .attr("class", "language-pattern")
        .attr("id", group => languagePatternId(group.id))
        .attr("patternUnits", "userSpaceOnUse")
        .attr("width", 14)
        .attr("height", 14);

      patternSelection.each(function(group) {
        const pattern = d3.select(this);
        const kind = group.pattern.kind;
        const color = group.pattern.color || "#111827";
        pattern.selectAll("*").remove();

        const stroke = shape => shape
          .attr("stroke", color)
          .attr("stroke-width", 2)
          .attr("stroke-linecap", "round")
          .attr("fill", "none");

        if (kind === "horizontal") {
          stroke(pattern.append("path").attr("d", "M0 4H14 M0 10H14"));
        } else if (kind === "vertical") {
          stroke(pattern.append("path").attr("d", "M4 0V14 M10 0V14"));
        } else if (kind === "diagonal") {
          stroke(pattern.append("path").attr("d", "M-4 14L14 -4 M0 18L18 0"));
        } else if (kind === "back_diagonal") {
          stroke(pattern.append("path").attr("d", "M-4 0L14 18 M0 -4L18 14"));
        } else if (kind === "checker") {
          pattern.append("rect").attr("x", 0).attr("y", 0).attr("width", 7).attr("height", 7).attr("fill", color);
          pattern.append("rect").attr("x", 7).attr("y", 7).attr("width", 7).attr("height", 7).attr("fill", color);
        } else if (kind === "dots") {
          pattern.append("circle").attr("cx", 4).attr("cy", 4).attr("r", 2).attr("fill", color);
          pattern.append("circle").attr("cx", 11).attr("cy", 11).attr("r", 2).attr("fill", color);
        } else if (kind === "plus") {
          stroke(pattern.append("path").attr("d", "M7 2V12 M2 7H12"));
        } else if (kind === "nordic_cross") {
          pattern.append("rect").attr("x", 4).attr("y", 0).attr("width", 3).attr("height", 14).attr("fill", color);
          pattern.append("rect").attr("x", 0).attr("y", 6).attr("width", 14).attr("height", 3).attr("fill", color);
        } else if (kind === "triangles") {
          pattern.append("path").attr("d", "M7 1L13 12H1Z").attr("fill", "none").attr("stroke", color).attr("stroke-width", 2);
        } else if (kind === "diamonds" || kind === "diamond_grid") {
          pattern.append("path").attr("d", "M7 1L13 7L7 13L1 7Z").attr("fill", "none").attr("stroke", color).attr("stroke-width", 2);
        } else if (kind === "zigzag") {
          stroke(pattern.append("path").attr("d", "M-1 8L3 4L7 8L11 4L15 8"));
        } else if (kind === "crosses") {
          stroke(pattern.append("path").attr("d", "M3 3L11 11 M11 3L3 11"));
        } else {
          stroke(pattern.append("path").attr("d", "M-1 9C3 3 7 15 15 7"));
        }
      });
    }

    function renderLanguageGuide() {
      const guide = document.querySelector("#language-guide-list");
      if (!guide) return;
      guide.innerHTML = LANGUAGE_GROUPS.map(group => `
        <div class="language-item">
          <span class="language-swatch" style="${guideSwatchStyle(group)}"></span>
          <span>
            <span class="language-title">${escapeHtml(group.label)}</span>
            <span class="language-mark">｜${escapeHtml(group.mark)}</span><br>
            <span class="language-hint">${escapeHtml(group.hint)}</span>
          </span>
        </div>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function defaultProfiles() {
      const profiles = {};
      PROFILE_IDS.forEach((id, index) => {
        profiles[id] = {
          name: `Profile${index + 1}`,
          showLanguagePatterns: true,
          showLeftDriveColors: true,
          selections: {},
          fadedFeatures: [],
          layoutCache: {},
          renderCache: null,
        };
      });
      return { activeProfileId: "profile1", profiles };
    }

    function normalizeFadedFeatureList(source) {
      const seen = new Set();
      return Array.isArray(source)
        ? source.map(String).filter(value => value && !seen.has(value) && seen.add(value))
        : [];
    }

    function normalizeLayoutCache(source) {
      const normalized = {};
      if (!source || typeof source !== "object") return normalized;
      for (const [key, entry] of Object.entries(source)) {
        if (!entry || typeof entry !== "object" || typeof entry.signature !== "string" || !Array.isArray(entry.photos)) continue;
        normalized[key] = {
          signature: entry.signature,
          photos: entry.photos
            .map(photo => ({
              ...photo,
              x: Number(photo.x),
              y: Number(photo.y),
              width: Number(photo.width),
              height: Number(photo.height),
            }))
            .filter(photo => photo.src && Number.isFinite(photo.x) && Number.isFinite(photo.y) && Number.isFinite(photo.width) && Number.isFinite(photo.height)),
        };
      }
      return normalized;
    }

    function normalizeRenderCache(source) {
      if (!source || typeof source !== "object") return null;
      if (typeof source.signature !== "string" || typeof source.html !== "string") return null;
      return {
        signature: source.signature,
        html: source.html,
      };
    }

    function normalizeProfileStore(source, legacySelections = {}, legacyFadedFeatures = []) {
      const defaults = defaultProfiles();
      const incomingProfiles = source?.profiles && typeof source.profiles === "object" ? source.profiles : {};
      for (const id of PROFILE_IDS) {
        const incoming = incomingProfiles[id] || {};
        defaults.profiles[id] = {
          name: String(incoming.name || defaults.profiles[id].name).slice(0, 28),
          showLanguagePatterns: incoming.showLanguagePatterns !== false,
          showLeftDriveColors: incoming.showLeftDriveColors !== false,
          selections: normalizeSelections(incoming.selections || {}),
          fadedFeatures: normalizeFadedFeatureList(incoming.fadedFeatures || []),
          layoutCache: normalizeLayoutCache(incoming.layoutCache || {}),
          renderCache: normalizeRenderCache(incoming.renderCache),
        };
      }
      if (!Object.keys(defaults.profiles.profile1.selections).length && Object.keys(legacySelections).length) {
        defaults.profiles.profile1.selections = normalizeSelections(legacySelections);
      }
      if (!defaults.profiles.profile1.fadedFeatures.length && legacyFadedFeatures.length) {
        defaults.profiles.profile1.fadedFeatures = normalizeFadedFeatureList(legacyFadedFeatures);
      }
      if (PROFILE_IDS.includes(source?.activeProfileId)) {
        defaults.activeProfileId = source.activeProfileId;
      }
      return defaults;
    }

    function loadProfiles() {
      const legacySelections = loadImageSelections();
      const legacyFadedFeatures = [...loadFadedFeatures()];
      const fromFile = window.PLONKIT_PROFILES && typeof window.PLONKIT_PROFILES === "object"
        ? window.PLONKIT_PROFILES
        : null;
      try {
        const fromStorage = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || "null");
        return normalizeProfileStore(fromStorage || fromFile, legacySelections, legacyFadedFeatures);
      } catch {
        return normalizeProfileStore(fromFile, legacySelections, legacyFadedFeatures);
      }
    }

    function activeProfile() {
      return state.profiles?.profiles?.[state.activeProfileId] || defaultProfiles().profiles.profile1;
    }

    function syncActiveProfileSelections() {
      const profile = activeProfile();
      state.imageSelections = profile.selections || {};
      state.fadedFeatures = new Set(normalizeFadedFeatureList(profile.fadedFeatures || []));
    }

    function persistProfiles() {
      if (!state.profiles) return;
      const profile = activeProfile();
      profile.selections = normalizeSelections(state.imageSelections);
      profile.fadedFeatures = normalizeFadedFeatureList([...state.fadedFeatures]);
      profile.layoutCache = normalizeLayoutCache(profile.layoutCache || {});
      profile.renderCache = normalizeRenderCache(profile.renderCache);
      state.imageSelections = profile.selections;
      state.profiles.activeProfileId = state.activeProfileId;
      localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(state.profiles));
      localStorage.setItem(SELECTION_STORAGE_KEY, JSON.stringify(state.imageSelections));
      localStorage.setItem(FADED_FEATURE_STORAGE_KEY, JSON.stringify([...state.fadedFeatures]));
      window.PLONKIT_PROFILES = state.profiles;
      window.PLONKIT_IMAGE_SELECTIONS = state.imageSelections;
      window.PLONKIT_FADED_FEATURES = [...state.fadedFeatures];
      updateSelectionExport();
    }

    function persistLayoutCache() {
      if ((!state.layoutCacheDirty && !state.renderCacheDirty) || !state.profiles) return;
      state.layoutCacheDirty = false;
      state.renderCacheDirty = false;
      state.profiles.activeProfileId = state.activeProfileId;
      localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(state.profiles));
      window.PLONKIT_PROFILES = state.profiles;
    }

    function renderProfilePanel() {
      if (!state.profiles) return;
      const buttons = document.querySelector("#profile-buttons");
      const nameInput = document.querySelector("#profile-name");
      const languageInput = document.querySelector("#profile-show-language");
      const leftDriveInput = document.querySelector("#profile-show-left-drive");
      if (!buttons || !nameInput || !languageInput || !leftDriveInput) return;

      buttons.innerHTML = PROFILE_IDS.map(id => {
        const profile = state.profiles.profiles[id];
        return `<button type="button" class="profile-button ${id === state.activeProfileId ? "active" : ""}" data-profile-id="${id}" title="${escapeHtml(profile.name)}">${escapeHtml(profile.name)}</button>`;
      }).join("");

      const profile = activeProfile();
      nameInput.value = profile.name;
      languageInput.checked = profile.showLanguagePatterns !== false;
      leftDriveInput.checked = profile.showLeftDriveColors !== false;

      buttons.querySelectorAll(".profile-button").forEach(button => {
        button.addEventListener("click", () => switchProfile(button.dataset.profileId));
      });
    }

    function switchProfile(profileId) {
      if (!PROFILE_IDS.includes(profileId) || profileId === state.activeProfileId) return;
      persistProfiles();
      state.activeProfileId = profileId;
      syncActiveProfileSelections();
      state.selectedImageFeatureCache = null;
      renderProfilePanel();
      updateCountryStyles();
      updateMapImages();
    }

    function bindProfilePanel() {
      const nameInput = document.querySelector("#profile-name");
      const languageInput = document.querySelector("#profile-show-language");
      const leftDriveInput = document.querySelector("#profile-show-left-drive");
      const downloadButton = document.querySelector("#download-profiles");
      const uploadButton = document.querySelector("#upload-profiles");
      const fileInput = document.querySelector("#profile-file-input");
      if (!nameInput || !languageInput || !leftDriveInput || !downloadButton || !uploadButton || !fileInput) return;

      nameInput.addEventListener("input", () => {
        const profile = activeProfile();
        profile.name = nameInput.value.trim() || state.activeProfileId.replace("profile", "Profile");
        const activeButton = document.querySelector(`.profile-button[data-profile-id="${state.activeProfileId}"]`);
        if (activeButton) {
          activeButton.textContent = profile.name;
          activeButton.title = profile.name;
        }
        persistProfiles();
      });

      languageInput.addEventListener("change", () => {
        activeProfile().showLanguagePatterns = languageInput.checked;
        persistProfiles();
      });

      leftDriveInput.addEventListener("change", () => {
        activeProfile().showLeftDriveColors = leftDriveInput.checked;
        persistProfiles();
        updateCountryStyles();
      });

      downloadButton.addEventListener("click", downloadProfileBackup);
      uploadButton.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", async () => {
        const file = fileInput.files?.[0];

        try {
          await importProfileBackup(file);
          showProfileTransferStatus("全部 Profile 已恢复");
        } catch (error) {
          showProfileTransferStatus(error?.message || "配置文件无法导入", true);
        }
      });

    function bindMobileMenu() {
      const head = document.querySelector(".map-head");
      const toggle = document.querySelector("#mobile-menu-toggle");
      if (!head || !toggle) return;

      const setOpen = open => {
        head.classList.toggle("menu-open", open);
        toggle.setAttribute("aria-expanded", String(open));
        toggle.setAttribute("aria-label", open ? "关闭配置菜单" : "打开配置菜单");
        toggle.setAttribute("title", open ? "关闭配置菜单" : "打开配置菜单");
        toggle.textContent = open ? "×" : "☰";
      };

      toggle.addEventListener("click", event => {
        event.stopPropagation();
        setOpen(!head.classList.contains("menu-open"));
      });
      document.addEventListener("click", event => {
        if (head.classList.contains("menu-open") && !head.contains(event.target)) setOpen(false);
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") setOpen(false);
      });

      const mobileQuery = window.matchMedia("(max-width: 980px)");
      const orientationQuery = window.matchMedia("(orientation: portrait)");
      mobileQuery.addEventListener("change", () => setOpen(false));
      orientationQuery.addEventListener("change", () => setOpen(false));

    function resetMobileDocumentScroll() {
      if (!window.matchMedia("(max-width: 980px)").matches) return;
      const side = document.querySelector(".side");
      if (side) requestAnimationFrame(() => { side.scrollTop = 0; });

    let profileTransferStatusTimer = null;

    function showProfileTransferStatus(message, isError = false) {
      const status = document.querySelector("#profile-transfer-status");
      if (!status) return;
      if (profileTransferStatusTimer) clearTimeout(profileTransferStatusTimer);
      status.textContent = message;
      status.classList.toggle("error", isError);
      status.classList.add("visible");
      profileTransferStatusTimer = setTimeout(() => status.classList.remove("visible"), 2600);
    }

    function profileBackupData() {
      persistProfiles();
      const profileStore = JSON.parse(JSON.stringify(state.profiles));
      for (const profile of Object.values(profileStore.profiles || {})) {
        profile.renderCache = null;
      }
      return {
        format: PROFILE_BACKUP_FORMAT,
        version: PROFILE_BACKUP_VERSION,
        exportedAt: new Date().toISOString(),
        activeProfileId: profileStore.activeProfileId,
        profiles: profileStore.profiles,
      };
    }

    function downloadProfileBackup() {
      const backup = JSON.stringify(profileBackupData(), null, 2);
      const blob = new Blob([backup], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = `geoguessr-map-profiles-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      showProfileTransferStatus("全部 Profile 已下载");
    }

    async function importProfileBackup(file) {
      if (file.size > PROFILE_BACKUP_MAX_BYTES) {
        throw new Error("配置文件过大，无法导入");
      }

      let backup;
      try {
        backup = JSON.parse(await file.text());
      } catch {
        throw new Error("这不是有效的 JSON 配置文件");
      }
      if (backup?.format !== PROFILE_BACKUP_FORMAT) {
        throw new Error("配置文件类型不正确");
      }
      if (backup.version !== PROFILE_BACKUP_VERSION) {
        throw new Error("配置文件版本不受支持");
      }
      if (!backup.profiles || typeof backup.profiles !== "object"
          || !PROFILE_IDS.every(id => backup.profiles[id] && typeof backup.profiles[id] === "object")) {
        throw new Error("配置文件缺少完整的 Profile 数据");
      }

      const incomingProfiles = {};
      for (const id of PROFILE_IDS) {
        incomingProfiles[id] = { ...backup.profiles[id], renderCache: null };
      }
      const restored = normalizeProfileStore({
        activeProfileId: backup.activeProfileId,
        profiles: incomingProfiles,
      });

      const previous = {
        profiles: state.profiles,
        activeProfileId: state.activeProfileId,
        imageSelections: state.imageSelections,
        fadedFeatures: state.fadedFeatures,
        profileStorage: localStorage.getItem(PROFILE_STORAGE_KEY),
        selectionStorage: localStorage.getItem(SELECTION_STORAGE_KEY),
        fadedStorage: localStorage.getItem(FADED_FEATURE_STORAGE_KEY),
      };

      try {
        state.profiles = restored;
        state.activeProfileId = restored.activeProfileId;
        syncActiveProfileSelections();
        state.selectedImageFeatureCache = null;
        state.layoutCacheDirty = false;
        state.renderCacheDirty = false;
        persistProfiles();
      } catch (error) {
        state.profiles = previous.profiles;
        state.activeProfileId = previous.activeProfileId;
        state.imageSelections = previous.imageSelections;
        state.fadedFeatures = previous.fadedFeatures;
        const restoreStorage = (key, value) => {
          if (value === null) localStorage.removeItem(key);
          else localStorage.setItem(key, value);
        };
        restoreStorage(PROFILE_STORAGE_KEY, previous.profileStorage);
        restoreStorage(SELECTION_STORAGE_KEY, previous.selectionStorage);
        restoreStorage(FADED_FEATURE_STORAGE_KEY, previous.fadedStorage);
        window.PLONKIT_PROFILES = state.profiles;
        window.PLONKIT_IMAGE_SELECTIONS = state.imageSelections;
        window.PLONKIT_FADED_FEATURES = [...state.fadedFeatures];
        throw new Error("浏览器存储空间不足，原配置未更改", { cause: error });
      }

      renderProfilePanel();
      updateCountryStyles();
      updateMapImages();
    }

    function loadImageSelections() {
      const fromFile = window.PLONKIT_IMAGE_SELECTIONS && typeof window.PLONKIT_IMAGE_SELECTIONS === "object"
        ? window.PLONKIT_IMAGE_SELECTIONS
        : {};
      try {
        const fromStorage = JSON.parse(localStorage.getItem(SELECTION_STORAGE_KEY) || "{}");
        return normalizeSelections({ ...fromFile, ...fromStorage });
      } catch {
        return normalizeSelections(fromFile);
      }
    }

    function normalizeSelections(source) {
      const normalized = {};
      for (const [slug, indices] of Object.entries(source || {})) {
        const page = state.pagesBySlug.get(slug);
        const max = page ? page.images.length : Number.MAX_SAFE_INTEGER;
        const seen = new Set();
        normalized[slug] = Array.isArray(indices)
          ? indices
              .map(value => Number(value))
              .filter(value => Number.isInteger(value) && value >= 0 && value < max && !seen.has(value) && seen.add(value))
          : [];
      }
      return normalized;
    }

    function loadFadedFeatures() {
      const fromFile = Array.isArray(window.PLONKIT_FADED_FEATURES) ? window.PLONKIT_FADED_FEATURES : [];
      try {
        const fromStorage = JSON.parse(localStorage.getItem(FADED_FEATURE_STORAGE_KEY) || "[]");
        return new Set([...fromFile, ...(Array.isArray(fromStorage) ? fromStorage : [])].map(String).filter(Boolean));
      } catch {
        return new Set(fromFile.map(String).filter(Boolean));
      }
    }

    function persistSelections(affectedSlug = "") {
      state.imageSelections = normalizeSelections(state.imageSelections);
      if (affectedSlug) {
        invalidateLayoutCacheForSlug(affectedSlug);
        invalidateRenderCache();
      }
      if (state.profiles?.profiles?.[state.activeProfileId]) {
        state.profiles.profiles[state.activeProfileId].selections = state.imageSelections;
      }
      persistProfiles();
      localStorage.setItem(SELECTION_STORAGE_KEY, JSON.stringify(state.imageSelections));
      localStorage.setItem(FADED_FEATURE_STORAGE_KEY, JSON.stringify([...state.fadedFeatures]));
      window.PLONKIT_FADED_FEATURES = [...state.fadedFeatures];
      state.selectedImageFeatureCache = null;
      updateSelectionExport();
      scheduleMapImagesUpdate();
    }

    function persistFadedFeatures() {
      persistProfiles();
      updateSelectionExport();
      updateCountryStyles();
    }

    function selectionFileText() {
      return [
        `window.PLONKIT_PROFILES = ${JSON.stringify(state.profiles, null, 2)};`,
        `window.PLONKIT_IMAGE_SELECTIONS = ${JSON.stringify(state.imageSelections, null, 2)};`,
        `window.PLONKIT_FADED_FEATURES = ${JSON.stringify([...state.fadedFeatures], null, 2)};`,
        "",
      ].join("\n");
    }

    function updateSelectionExport() {
      const anchor = document.querySelector("#download-selections");
      if (!anchor) return;
      const blob = new Blob([selectionFileText()], { type: "text/javascript;charset=utf-8" });
      if (anchor.dataset.objectUrl) URL.revokeObjectURL(anchor.dataset.objectUrl);
      const url = URL.createObjectURL(blob);
      anchor.href = url;
      anchor.dataset.objectUrl = url;
    }

    async function saveSelectionFile() {
      const text = selectionFileText();
      const status = document.querySelector("#selection-status");
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: "plonkit_image_selections.js",
            types: [{
              description: "JavaScript selection data",
              accept: { "text/javascript": [".js"] },
            }],
          });
          const writable = await handle.createWritable();
          await writable.write(text);
          await writable.close();
          if (status) status.textContent = "已保存选择文件";
          return;
        } catch (error) {
          if (error?.name === "AbortError") return;
        }
      }
      const anchor = document.querySelector("#download-selections");
      if (anchor) anchor.click();
      if (status) status.textContent = "已下载选择文件，请替换同名文件后再打包";
    }

    function decodeHtml(value) {
      const textarea = document.createElement("textarea");
      textarea.innerHTML = String(value || "");
      return textarea.value;
    }

    function parseImageCard(attrs) {
      const valueMatch = attrs.match(/\bvalue="([^"]+)"/i);
      if (!valueMatch) return "";
      let value = decodeHtml(valueMatch[1]);
      if (value.startsWith("data:")) value = value.slice(5);
      try {
        const data = JSON.parse(decodeURIComponent(value));
        if (!data.src) return "";
        const alt = escapeHtml(data.alt || data.name || "");
        return `<figure><img src="${escapeHtml(data.src)}" alt="${alt}" loading="lazy" referrerpolicy="no-referrer"></figure>`;
      } catch {
        return "";
      }
    }

    function lakeToHtml(content) {
      const html = String(content || "")
        .replace(/<!doctype\s+lake>/gi, "")
        .replace(/<meta\b[^>]*\/?>/gi, "")
        .replace(/<card\b([^>]*)>/gi, (full, attrs) => {
          const name = (attrs.match(/\bname="([^"]+)"/i) || [])[1] || "";
          if (name === "image") return parseImageCard(attrs);
          if (name === "hr") return "<hr>";
          return "";
        });

      const template = document.createElement("template");
      template.innerHTML = html;

      template.content.querySelectorAll("script, style, iframe, object, embed, form, input, button").forEach(node => node.remove());
      template.content.querySelectorAll("*").forEach(node => {
        for (const attr of [...node.attributes]) {
          const name = attr.name.toLowerCase();
          const value = attr.value || "";
          if (name.startsWith("on") || name === "srcdoc" || name === "style") {
            node.removeAttribute(attr.name);
          }
          if ((name === "href" || name === "src") && !/^(https?:|data:image\/)/i.test(value)) {
            node.removeAttribute(attr.name);
          }
        }
        if (node.tagName === "A") {
          node.setAttribute("target", "_blank");
          node.setAttribute("rel", "noopener noreferrer");
        }
        if (node.tagName === "IMG") {
          node.setAttribute("loading", "lazy");
          node.setAttribute("referrerpolicy", "no-referrer");
        }
      });

      return template.innerHTML;
    }

    function pageForSlug(slug) {
      return state.pagesBySlug.get(slug);
    }

    function slugsForFeature(feature) {
      const region = (feature.properties || {})._region;
      if (region === "alaska") return [];
      if (region === "hawaii") return state.index.pages.hawaii ? ["hawaii"] : [];
      if (region === "usa-rest") {
        return ["united-states", "us-minor-outlying-islands"].filter(slug => state.index.pages[slug]);
      }
      const id = featureId(feature);
      const code = featureCode(feature);
      const direct = state.index.featurePages[id] || [];
      if (direct.length) return direct;
      if (code === "CHN") return [];
      for (const candidate of featureCodeCandidates(feature)) {
        if (candidate === "CHN") return [];
        const pages = state.index.codePages[candidate] || [];
        if (pages.length) return pages;
      }
      return [];
    }

    function renderPageTabs(slugs, activeSlug) {
      if (slugs.length <= 1) return "";
      return `<div class="page-tabs">${slugs.map(slug => {
        const page = pageForSlug(slug);
        const label = page ? displayPageTitle(page) : slug;
        const active = slug === activeSlug ? " active" : "";
        return `<button type="button" class="page-tab${active}" data-slug="${escapeHtml(slug)}">${escapeHtml(label)}</button>`;
      }).join("")}</div>`;
    }

    function renderPage(slugs, activeSlug = slugs[0], feature = null) {
      const panel = document.querySelector("#doc-panel");
      const page = pageForSlug(activeSlug);
      if (!page) {
        panel.innerHTML = `<div class="placeholder">没有找到本地抓取页面。</div>`;
        return;
      }
      const fadeKey = feature ? featureFadeKey(feature) : "";
      const faded = fadeKey && state.fadedFeatures.has(fadeKey);

      panel.innerHTML = `
        ${renderPageTabs(slugs, activeSlug)}
        <h2 class="doc-title">${escapeHtml(displayPageTitle(page))}</h2>
        <div class="doc-meta">
          <span>${escapeHtml(page.section || "Plonk It")}</span>
          <span>${Number(page.yuque?.wordCount || 0)} 字</span>
          <span>${Number(page.images?.length || 0)} 图</span>
          <span>更新：${escapeHtml((page.yuque?.contentUpdatedAt || "").slice(0, 10) || "未知")}</span>
        </div>
        <div class="political-note">本页内容仅作街景识别学习参考；涉及地区名称、边界、主权或行政归属时，以中国大陆发布和审定的标准地图及公开规范表述为准。</div>
        <div class="selection-tools">
          <button type="button" id="save-selections">保存选择文件</button>
          <a id="download-selections" download="plonkit_image_selections.js" style="display:none"></a>
          <div class="selection-status" id="selection-status"></div>
          ${fadeKey ? `
            <label class="fade-toggle">
              <input type="checkbox" id="fade-country" ${faded ? "checked" : ""}>
              <span>淡化这个国家/地区</span>
            </label>
          ` : ""}
          <p>勾选图片后会按当前页面内的勾选顺序标号，并显示到对应地图区域。要把结果发给朋友，请点击保存选择文件，并用下载得到的文件替换 <code>data/generated/plonkit_image_selections.js</code> 后再打包。</p>
        </div>
        <article class="article">${lakeToHtml(page.content)}</article>
      `;
      applyPoliticalTextPolicy(panel);

      panel.querySelectorAll(".page-tab").forEach(button => {
        button.addEventListener("click", () => renderPage(slugs, button.dataset.slug, feature));
      });
      panel.querySelector("#save-selections").addEventListener("click", saveSelectionFile);
      const fadeInput = panel.querySelector("#fade-country");
      if (fadeInput && fadeKey) {
        fadeInput.addEventListener("change", () => {
          if (fadeInput.checked) state.fadedFeatures.add(fadeKey);
          else state.fadedFeatures.delete(fadeKey);
          persistFadedFeatures();
        });
      }
      decorateArticleImages(page);
      updateSelectionExport();
      resetMobileDocumentScroll();
    }

    function decorateArticleImages(page) {
      const panel = document.querySelector("#doc-panel");
      const article = panel.querySelector(".article");
      const images = [...article.querySelectorAll("img")];
      const selected = state.imageSelections[page.slug] || [];

      images.forEach((img, index) => {
        let wrapper = img.closest("figure") || img.parentElement;
        if (!wrapper || wrapper === article) {
          wrapper = document.createElement("figure");
          img.replaceWith(wrapper);
          wrapper.appendChild(img);
        }
        wrapper.classList.add("image-choice");
        wrapper.dataset.imageIndex = String(index);

        const checked = selected.includes(index);
        const rank = checked ? selected.indexOf(index) + 1 : "";
        const picker = document.createElement("label");
        picker.className = "image-picker";
        picker.innerHTML = `
          <input type="checkbox" ${checked ? "checked" : ""} data-image-index="${index}">
          <span class="image-rank">${rank || "-"}</span>
          <span>地图图片</span>
        `;
        wrapper.prepend(picker);
        wrapper.classList.toggle("selected-image", checked);
      });

      article.querySelectorAll('.image-picker input[type="checkbox"]').forEach(input => {
        input.addEventListener("change", () => {
          const index = Number(input.dataset.imageIndex);
          const current = state.imageSelections[page.slug] ? [...state.imageSelections[page.slug]] : [];
          const existing = current.indexOf(index);
          if (input.checked && existing === -1) current.push(index);
          if (!input.checked && existing !== -1) current.splice(existing, 1);
          state.imageSelections[page.slug] = current;
          refreshArticleImageRanks(page.slug);
          persistSelections(page.slug);
        });
      });
    }

    function refreshArticleImageRanks(slug) {
      const selected = state.imageSelections[slug] || [];
      document.querySelectorAll(".image-choice").forEach(wrapper => {
        const index = Number(wrapper.dataset.imageIndex);
        const rank = selected.indexOf(index);
        wrapper.classList.toggle("selected-image", rank !== -1);
        const input = wrapper.querySelector('input[type="checkbox"]');
        const badge = wrapper.querySelector(".image-rank");
        if (input) input.checked = rank !== -1;
        if (badge) badge.textContent = rank === -1 ? "-" : String(rank + 1);
      });
    }

    function renderSkippedChina() {
      document.querySelector("#doc-panel").innerHTML = `
        <h2 class="doc-title">中国大陆</h2>
        <div class="placeholder">中国大陆没有街景，按要求保持白色；中国页面也没有抓取。</div>

    function renderNoStreetView(name) {
      document.querySelector("#doc-panel").innerHTML = `
        <h2 class="doc-title">${escapeHtml(name)}</h2>
        <div class="placeholder">${escapeHtml(name)}没有街景，因此保持白色，不显示教程页面。</div>

    function renderNoPage(feature) {
      document.querySelector("#doc-panel").innerHTML = `
        <h2 class="doc-title">${escapeHtml(featureName(feature))}</h2>
        <div class="political-note">本页不以地图面名称、颜色或边界表达任何法律或政治立场。</div>
