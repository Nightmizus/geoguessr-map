      `;
    }

    function renderFeaturePage(feature) {
      const slugs = slugsForFeature(feature);
      if (!slugs.length) {
        renderNoPage(feature);
        resetMobileDocumentScroll();
        return;
      }
      renderPage(slugs, slugs[0], feature);
    }

    function selectedImagesForFeature(feature) {
      const code = featureCode(feature);
      if (code === "CHN" || !hasFeaturePage(feature) || (feature.properties || {})._region === "alaska") {
        return [];
      }
      const slugs = slugsForFeature(feature);
      const images = [];
      for (const slug of slugs) {
        const page = pageForSlug(slug);
        const selection = state.imageSelections[slug] || [];
        selection.forEach((imageIndex, selectionIndex) => {
          const image = page?.images?.[imageIndex];
          if (image?.src) {
            images.push({
              key: `${featureId(feature)}:${slug}:${imageIndex}`,
              src: image.src,
              title: page.title,
              slug,
              imageIndex,
              aspectRatio: aspectRatioForImage(image),
              order: selectionIndex + 1,
            });
          }
        });
      }
      return images;
    }

    function selectedImageFeatureEntries() {
      if (!state.selectedImageFeatureCache) {
        state.selectedImageFeatureCache = state.mapFeatures
          .map(feature => ({ feature, images: selectedImagesForFeature(feature) }))
          .filter(entry => entry.images.length);
      }
      return state.selectedImageFeatureCache;
    }

    function aspectRatioForImage(image) {
      const cached = state.imageAspectRatios.get(image?.src);
      if (cached) return cached;
      const width = Number(image?.width);
      const height = Number(image?.height);
      if (width > 0 && height > 0) return width / height;
      return DEFAULT_PHOTO_ASPECT_RATIO;
    }

    function loadImageAspectRatio(image) {
      if (!image?.src || state.imageAspectRatios.has(image.src) || state.pendingAspectLoads.has(image.src)) return;
      state.pendingAspectLoads.add(image.src);
      const probe = new Image();
      probe.referrerPolicy = "no-referrer";
      probe.onload = () => {
        state.pendingAspectLoads.delete(image.src);
        if (probe.naturalWidth > 0 && probe.naturalHeight > 0) {
          state.imageAspectRatios.set(image.src, probe.naturalWidth / probe.naturalHeight);
          invalidateLayoutCacheForImageSrc(image.src);
          state.selectedImageFeatureCache = null;
          scheduleMapImagesUpdate();
        }
      };
      probe.onerror = () => {
        state.pendingAspectLoads.delete(image.src);
      };
      probe.src = image.src;
    }

    function transformedBounds(feature) {
      const bounds = feature.properties?._baseBounds || state.path.bounds(feature);
      const t = state.zoomTransform;
      return {
        x0: t.applyX(bounds[0][0]),
        y0: t.applyY(bounds[0][1]),
        x1: t.applyX(bounds[1][0]),
        y1: t.applyY(bounds[1][1]),
      };
    }

    function rectsOverlap(a, b) {
      const gap = Math.max(0.2, Math.min(a.width, a.height, b.width, b.height) * PHOTO_GAP_RATIO);
      return !(
        a.x + a.width + gap <= b.x ||
        b.x + b.width + gap <= a.x ||
        a.y + a.height + gap <= b.y ||
        b.y + b.height + gap <= a.y
      );
    }

    function photoGapForSize(size) {
      return Math.max(0.2, Math.min(size.width, size.height) * PHOTO_GAP_RATIO);
    }

    function photoSizeForArea(image, targetArea) {
      const ratio = Math.max(0.18, Math.min(6, Number(image?.aspectRatio) || DEFAULT_PHOTO_ASPECT_RATIO));
      const width = Math.sqrt(targetArea * ratio);
      return {
        width,
        height: width / ratio,
      };
    }

    function layoutCacheKeyForFeature(feature) {
      return featureFadeKey(feature) || featureCode(feature) || featureName(feature);
    }

    function layoutSignatureForFeature(feature, images) {
      const area = Math.round(Math.max(1, feature.properties?._baseArea || state.path?.area(feature) || 1) * 100);
      const imagePart = images
        .map(image => [
          image.slug,
          image.imageIndex,
          image.src,
          Number(image.aspectRatio || DEFAULT_PHOTO_ASPECT_RATIO).toFixed(4),
        ].join(","))
        .join("|");
      return [
        `v${LAYOUT_CACHE_VERSION}`,
        layoutCacheKeyForFeature(feature),
        Math.round(COUNTRY_IMAGE_FILL_RATIO * 1000),
        isRelaxedImageFeature(feature) ? "relaxed" : "strict",
        area,
        imagePart,
      ].join("::");
    }

    function cachedLayoutForFeature(feature, images) {
      const cache = activeProfile().layoutCache || {};
      const entry = cache[layoutCacheKeyForFeature(feature)];
      const signature = layoutSignatureForFeature(feature, images);
      if (!entry || entry.signature !== signature || !Array.isArray(entry.photos)) return null;
      return entry.photos.map(photo => ({ ...photo }));
    }

    function stableSelectionsSignature(selections) {
      return Object.keys(selections || {})
        .sort()
        .map(slug => `${slug}:${(selections[slug] || []).join(",")}`)
        .join("|");
    }

    function layoutCacheSignature(profile) {
      return Object.keys(profile.layoutCache || {})
        .sort()
        .map(key => `${key}:${profile.layoutCache[key]?.signature || ""}`)
        .join("|");
    }

    function renderSignatureForProfile(profile = activeProfile()) {
      return [
        `v${RENDER_CACHE_VERSION}`,
        `layout-v${LAYOUT_CACHE_VERSION}`,
        stableSelectionsSignature(profile.selections || state.imageSelections),
        layoutCacheSignature(profile),
      ].join("::");
    }

    function cachedRenderHtml() {
      const profile = activeProfile();
      const cache = normalizeRenderCache(profile.renderCache);
      if (!cache || cache.signature !== renderSignatureForProfile(profile)) return null;
      return cache.html;
    }

    function storeRenderHtml(html) {
      const profile = activeProfile();
      profile.renderCache = {
        signature: renderSignatureForProfile(profile),
        html,
      };
      state.renderCacheDirty = true;
    }

    function invalidateRenderCache() {
      const profile = activeProfile();
      if (profile.renderCache) {
        profile.renderCache = null;
        state.renderCacheDirty = true;
      }
    }

    function storeLayoutForFeature(feature, images, photos) {
      const profile = activeProfile();
      profile.layoutCache = profile.layoutCache || {};
      profile.layoutCache[layoutCacheKeyForFeature(feature)] = {
        signature: layoutSignatureForFeature(feature, images),
        photos: photos.map(photo => ({
          ...photo,
          x: Number(photo.x),
          y: Number(photo.y),
          width: Number(photo.width),
          height: Number(photo.height),
        })),
      };
      state.layoutCacheDirty = true;
      invalidateRenderCache();
    }

    function invalidateLayoutCacheForFeature(feature) {
      const profile = activeProfile();
      if (!profile.layoutCache) return;
      const key = layoutCacheKeyForFeature(feature);
      if (profile.layoutCache[key]) {
        delete profile.layoutCache[key];
        state.layoutCacheDirty = true;
        invalidateRenderCache();
      }
    }

    function invalidateLayoutCacheForSlug(slug) {
      for (const feature of state.mapFeatures) {
        if (slugsForFeature(feature).includes(slug)) invalidateLayoutCacheForFeature(feature);
      }
      persistLayoutCache();
    }

    function invalidateLayoutCacheForImageSrc(src) {
      if (!src) return;
      const profile = activeProfile();
      const cache = profile.layoutCache || {};
      for (const [key, entry] of Object.entries(cache)) {
        if (entry?.photos?.some(photo => photo.src === src)) {
          delete cache[key];
          state.layoutCacheDirty = true;
          invalidateRenderCache();
        }
      }
      persistLayoutCache();
    }

    function pointInFeatureBase(feature, x, y) {
      const lonLat = state.projection?.invert([x, y]);
      return Array.isArray(lonLat) && Number.isFinite(lonLat[0]) && Number.isFinite(lonLat[1]) && d3.geoContains(feature, lonLat);
    }

    function rectInsideFeatureBase(feature, x, y, rectWidth, rectHeight) {
      const left = x;
      const right = x + rectWidth;
      const top = y;
      const bottom = y + rectHeight;
      const cols = STRICT_RECT_SAMPLE_COLS;
      const rows = STRICT_RECT_SAMPLE_ROWS;
      for (let row = 0; row < rows; row += 1) {
        const sampleY = top + (bottom - top) * (row / (rows - 1));
        for (let col = 0; col < cols; col += 1) {
          const sampleX = left + (right - left) * (col / (cols - 1));
          if (!pointInFeatureBase(feature, sampleX, sampleY)) return false;
        }
      }
      return true;
    }

    function addCandidate(candidates, feature, x, y, centerX, centerY, rectWidth, rectHeight, relaxed) {
      if (candidates.length >= MAX_CANDIDATES_PER_FEATURE) return;
      if (!relaxed && !rectInsideFeatureBase(feature, x, y, rectWidth, rectHeight)) return;
      const dx = x + rectWidth / 2 - centerX;
      const dy = y + rectHeight / 2 - centerY;
      candidates.push({
        x,
        y,
        distance: dx * dx + dy * dy,
      });
    }

    function candidateCacheKey(feature, size, forceRelaxed) {
      return [
        featureId(feature),
        Math.round(size.width * 100),
        Math.round(size.height * 100),
        forceRelaxed ? "relaxed" : "strict",
      ].join(":");
    }

    function candidateImagePositions(feature, size, forceRelaxed = false) {
      const cacheKey = candidateCacheKey(feature, size, forceRelaxed);
      const cached = state.candidatePositionCache.get(cacheKey);
      if (cached) return cached;

      const relaxed = forceRelaxed || isRelaxedImageFeature(feature);
      const bounds = feature.properties?._baseBounds || state.path.bounds(feature);
      const spanX = bounds[1][0] - bounds[0][0];
      const spanY = bounds[1][1] - bounds[0][1];
      const relaxedOverflowX = relaxed ? size.width * 0.62 : 0;
      const relaxedOverflowY = relaxed ? size.height * 0.62 : 0;
      const overflowX = relaxedOverflowX + Math.max(0, (size.width - spanX) / 2);
      const overflowY = relaxedOverflowY + Math.max(0, (size.height - spanY) / 2);
      const x0 = bounds[0][0] - overflowX;
      const y0 = bounds[0][1] - overflowY;
      const x1 = bounds[1][0] + overflowX;
      const y1 = bounds[1][1] + overflowY;
      if (x1 - x0 < size.width || y1 - y0 < size.height) {
        state.candidatePositionCache.set(cacheKey, []);
        return [];
      }

      const centroid = feature.properties?._baseCentroid || state.path.centroid(feature);
      const centerX = centroid[0];
      const centerY = centroid[1];
      const gap = photoGapForSize(size);
      const stepX = Math.max(size.width * 0.45, size.width + gap);
      const stepY = Math.max(size.height * 0.45, size.height + gap);
      const candidates = [];
      let attempts = 0;
      const centerCandidateX = Math.min(Math.max(centerX - size.width / 2, x0), x1 - size.width);
      const centerCandidateY = Math.min(Math.max(centerY - size.height / 2, y0), y1 - size.height);

      addCandidate(candidates, feature, centerCandidateX, centerCandidateY, centerX, centerY, size.width, size.height, relaxed);
      attempts += 1;

      for (let y = y0; y <= y1 - size.height && attempts < MAX_CANDIDATE_ATTEMPTS && candidates.length < MAX_CANDIDATES_PER_FEATURE; y += stepY) {
        for (let x = x0; x <= x1 - size.width && attempts < MAX_CANDIDATE_ATTEMPTS && candidates.length < MAX_CANDIDATES_PER_FEATURE; x += stepX) {
          attempts += 1;
          addCandidate(candidates, feature, x, y, centerX, centerY, size.width, size.height, relaxed);
        }
      }

      const edgeX = x1 - size.width;
      const edgeY = y1 - size.height;
      for (let y = y0; y <= y1 - size.height && attempts < MAX_CANDIDATE_ATTEMPTS && candidates.length < MAX_CANDIDATES_PER_FEATURE; y += stepY) {
        attempts += 1;
        addCandidate(candidates, feature, edgeX, y, centerX, centerY, size.width, size.height, relaxed);
      }
      for (let x = x0; x <= x1 - size.width && attempts < MAX_CANDIDATE_ATTEMPTS && candidates.length < MAX_CANDIDATES_PER_FEATURE; x += stepX) {
        attempts += 1;
        addCandidate(candidates, feature, x, edgeY, centerX, centerY, size.width, size.height, relaxed);
      }

      const unique = new Map();
      for (const candidate of candidates) {
        const key = `${Math.round(candidate.x)}:${Math.round(candidate.y)}`;
        if (!unique.has(key)) unique.set(key, candidate);
      }

      const sorted = [...unique.values()]
        .sort((a, b) => a.distance - b.distance)
        .slice(0, MAX_CANDIDATES_PER_FEATURE);
      state.candidatePositionCache.set(cacheKey, sorted);
      return sorted;
    }

    function layoutImagesInFeature(feature, images) {
      if (!images.length || !state.path || !state.projection) return [];
      const cached = cachedLayoutForFeature(feature, images);
      if (cached) return cached;

      for (const image of images) {
        loadImageAspectRatio(image);
        image.aspectRatio = state.imageAspectRatios.get(image.src) || image.aspectRatio;
      }

      const featureArea = Math.max(1, feature.properties?._baseArea || state.path.area(feature) || 1);
      const targetImageArea = featureArea * COUNTRY_IMAGE_FILL_RATIO / images.length;
      const scaleSteps = [1, 0.82, 0.68, 0.56, 0.46, 0.38, 0.31, 0.25, 0.2, 0.16, 0.13, 0.1];
      const clipPathId = isRelaxedImageFeature(feature) ? null : clipIdForFeature(feature);

      for (const scale of scaleSteps) {
        const placed = [];
        for (let index = 0; index < images.length; index += 1) {
          const size = photoSizeForArea(images[index], targetImageArea * scale * scale);
          const candidates = candidateImagePositions(feature, size);
          if (!candidates.length) continue;
          const candidate = candidates.find(position => {
            const rect = { x: position.x, y: position.y, width: size.width, height: size.height };
            return !placed.some(existing => rectsOverlap(rect, existing));
          });
          if (!candidate) continue;
          const photo = {
            ...images[index],
            x: candidate.x,
            y: candidate.y,
            width: size.width,
            height: size.height,
            displayOrder: index + 1,
            clipPathId,
          };
          placed.push(photo);
        }
        if (placed.length === images.length || placed.length > 0 && scale === scaleSteps[scaleSteps.length - 1]) {
          storeLayoutForFeature(feature, images, placed);
          return placed;
        }
      }
      storeLayoutForFeature(feature, images, []);
      return [];
    }

    function formatNumber(value) {
      return Number(value).toFixed(3).replace(/\.?0+$/, "");
    }

    function renderMapPhotosHtml(imageData) {
      return imageData.map(photo => {
        const clip = photo.clipPathId ? ` clip-path="url(#${escapeHtml(photo.clipPathId)})"` : "";
        return `<g class="map-photo"${clip}><image href="${escapeHtml(photo.src)}" x="${formatNumber(photo.x)}" y="${formatNumber(photo.y)}" width="${formatNumber(photo.width)}" height="${formatNumber(photo.height)}" preserveAspectRatio="xMidYMid meet" referrerpolicy="no-referrer"></image></g>`;
      }).join("");
    }

    function updateMapImages() {
      if (!state.overlayLayer || !state.mapFeatures.length || !state.path) return;
      const cachedHtml = cachedRenderHtml();
      if (cachedHtml !== null) {
        state.overlayLayer.html(cachedHtml);
        return;
      }

      const imageData = selectedImageFeatureEntries().flatMap(entry => layoutImagesInFeature(entry.feature, entry.images));
      const html = renderMapPhotosHtml(imageData);
      state.overlayLayer.html(html);
      storeRenderHtml(html);
      persistLayoutCache();
      return;

    }

    function scheduleMapImagesUpdate() {
      if (state.imageUpdateFrame) return;
      if (state.imageUpdateTimer) return;
      state.imageUpdateTimer = window.setTimeout(() => {
        state.imageUpdateTimer = 0;
        if (state.imageUpdateFrame) return;
        state.imageUpdateFrame = 0;
        state.imageUpdateFrame = requestAnimationFrame(() => {
          state.imageUpdateFrame = 0;
          updateMapImages();
        });
      }, 80);
    }

    function renderLists() {
      const pages = [...state.pages.pages].sort((a, b) => a.title.localeCompare(b.title, "zh-CN"));
      document.querySelector("#page-count").textContent = state.pages.count;
      document.querySelector("#red-count").textContent = state.targetCodes.size;
      document.querySelector("#fail-count").textContent = state.pages.failureCount;
      document.querySelector("#page-list").innerHTML = pages
        .map(page => `<li>${escapeHtml(displayPageTitle(page))} <span style="color:#5f6c76">/${escapeHtml(page.slug)}</span></li>`)
        .join("");

      const unmatched = [
        ...state.index.unmatched.map(page => `${replacePoliticalText(page.title)}：当前地图数据没有独立面`),
        ...state.index.skipped.map(page => `${replacePoliticalText(page.title)}：${replacePoliticalText(page.reason)}`),
        "中国香港：有街景但暂无页面",
        "中国澳门：有街景但暂无页面",
        "中国台湾：有街景但暂无页面",
        "中国藏南地区：按中国国土显示，暂无教程页面",
        "阿拉斯加：没有街景，已保持白色"
      ];
      document.querySelector("#unmatched-list").innerHTML = unmatched
        .map(item => `<li>${escapeHtml(item)}</li>`)
        .join("");
    }

    function findSingaporeFeature(features) {
      return features.find(feature => featureCodeCandidates(feature).includes("SGP"))
        || features.find(feature => slugsForFeature(feature).includes("singapore"));
    }

    function zoomLimitForFeature(feature) {
      if (!feature || !state.path) return 200;
      const bounds = feature.properties?._baseBounds || state.path.bounds(feature);
      const spanX = Math.max(0.001, bounds[1][0] - bounds[0][0]);
      const spanY = Math.max(0.001, bounds[1][1] - bounds[0][1]);
      const fitScale = Math.min(width / spanX, height / spanY) * 0.98;
      return Math.max(1, Math.min(2000, fitScale));
    }

    function bindMapZoom(zoomLayer, mapFeatures) {
      const maxZoom = zoomLimitForFeature(findSingaporeFeature(mapFeatures));
      let zoomFrame = 0;
      let pendingTransform = d3.zoomIdentity;

      function applyZoomTransform(transform) {
        state.zoomTransform = transform;
        pendingTransform = transform;
        if (zoomFrame) return;
        zoomFrame = requestAnimationFrame(() => {
          zoomFrame = 0;
          zoomLayer.attr("transform", pendingTransform);
        });
      }

      const zoom = d3.zoom()
        .scaleExtent([1, maxZoom])
        .translateExtent([[-width * 24, -height * 24], [width * 25, height * 25]])
        .on("zoom", event => applyZoomTransform(event.transform))
        .on("end", event => applyZoomTransform(event.transform));

      svg.call(zoom);
      svg.on("dblclick.zoom", null);

      document.querySelector("#zoom-in")?.addEventListener("click", () => {
        svg.transition().duration(180).call(zoom.scaleBy, 1.6);
      });
      document.querySelector("#zoom-out")?.addEventListener("click", () => {
        svg.transition().duration(180).call(zoom.scaleBy, 0.625);
      });
      document.querySelector("#zoom-reset")?.addEventListener("click", () => {
        svg.transition().duration(220).call(zoom.transform, d3.zoomIdentity);
      });
    }

    async function boot() {
      const geo = window.PLONKIT_GEO;
      const index = window.PLONKIT_MAP_INDEX;
      const pages = window.PLONKIT_PAGES;
      if (!geo || !index || !pages) {
        throw new Error("本地数据文件没有加载成功");
      }

      state.index = index;
      state.pages = pages;
      state.pagesBySlug = new Map(pages.pages.map(page => [page.slug, page]));
      state.targetCodes = displayTargetCodes(index);
      state.profiles = loadProfiles();
      state.activeProfileId = state.profiles.activeProfileId;
      syncActiveProfileSelections();

      renderLists();
      renderLanguageGuide();
      renderProfilePanel();
      bindProfilePanel();
      bindMobileMenu();

      const projection = d3.geoNaturalEarth1()
        .rotate([-150, 0])
        .fitExtent([[18, 20], [width - 18, height - 20]], { type: "Sphere" });

      const path = d3.geoPath(projection);
      state.path = path;
      state.projection = projection;

      const zoomLayer = svg.append("g")
        .attr("class", "zoom-layer");

      zoomLayer.append("path")
        .datum({ type: "Sphere" })
        .attr("class", "sphere")
        .attr("d", path);

      const mapFeatures = applyPoliticalOverrides(mergeCountryFeatures(geo.features.flatMap(splitFeature)));
      mapFeatures.forEach(feature => {
        const properties = feature.properties || (feature.properties = {});
        properties._baseBounds = path.bounds(feature);
        properties._baseCentroid = path.centroid(feature);
        properties._baseArea = Math.max(1, path.area(feature));
      });
      state.mapFeatures = mapFeatures;
      state.featureById = new Map(mapFeatures.map(feature => [featureId(feature), feature]));

      const defs = svg.append("defs");
      createLanguagePatterns(defs);

      const chinaBoundaryFeature = mapFeatures.find(feature => featureCode(feature) === "CHN");
      if (chinaBoundaryFeature) {
        const indiaChinaRenderMask = defs.append("mask")
          .attr("id", INDIA_CHINA_RENDER_MASK_ID)
          .attr("maskUnits", "userSpaceOnUse")
          .attr("maskContentUnits", "userSpaceOnUse")
          .attr("x", 0)
          .attr("y", 0)
          .attr("width", width)
          .attr("height", height)
          .style("mask-type", "luminance");

        indiaChinaRenderMask.append("rect")
          .attr("x", 0)
          .attr("y", 0)
          .attr("width", width)
          .attr("height", height)
          .attr("fill", "white");

        indiaChinaRenderMask.append("path")
          .datum(normalizedFillFeature(chinaBoundaryFeature))
          .attr("fill", "black")
          .attr("d", path);
      }

      defs
        .selectAll("clipPath")
        .data(mapFeatures.filter(feature => !isRelaxedImageFeature(feature)))
        .join("clipPath")
        .attr("id", clipIdForFeature)
        .attr("clipPathUnits", "userSpaceOnUse")
        .append("path")
        .attr("d", path);

      const renderFeatures = mapFeatures.filter(hasFeaturePage);
      const renderLayer = zoomLayer.append("g")
        .attr("class", "map-render-layer");

      state.renderFillSelection = renderLayer.append("g")
        .attr("class", "render-fill-layer")
        .selectAll("path")
        .data(renderFeatures)
        .join("path")
        .attr("class", "country-render-fill")
        .attr("data-code", d => featureCodeCandidates(d).join(" "))
        .attr("data-slugs", d => slugsForFeature(d).join(" "))
        .attr("fill", countryRenderFill)
        .attr("mask", d => chinaBoundaryFeature && featureCode(d) === "IND"
          ? `url(#${INDIA_CHINA_RENDER_MASK_ID})`
          : null)
        .attr("d", path);

      state.renderTextureSelection = renderLayer.append("g")
        .attr("class", "render-texture-layer")
        .selectAll("path")
        .data(renderFeatures)
        .join("path")
        .attr("class", "country-render-texture")
        .attr("data-code", d => featureCodeCandidates(d).join(" "))
        .attr("data-slugs", d => slugsForFeature(d).join(" "))
        .attr("fill", countryRenderTexture)
        .attr("mask", d => chinaBoundaryFeature && featureCode(d) === "IND"
          ? `url(#${INDIA_CHINA_RENDER_MASK_ID})`
          : null)
        .attr("d", path);

      state.overlayLayer = zoomLayer.append("g")
        .attr("class", "image-overlay");

      state.clickPathSelection = zoomLayer.append("g")
        .attr("class", "country-click-layer")
        .selectAll("path")
        .data(mapFeatures.filter(hasFeaturePage))
        .join("path")
        .attr("class", "country-click-target")
        .attr("data-code", d => featureCodeCandidates(d).join(" "))
        .attr("data-slugs", d => slugsForFeature(d).join(" "))
        .attr("d", path)
        .on("click", (event, feature) => {
          if (event.defaultPrevented) return;
          renderFeaturePage(feature);
        });

      const borderLayer = zoomLayer.append("g")
        .attr("class", "border-layer");

      state.borderPathSelection = borderLayer.append("g")
        .attr("class", "border-line-layer")
        .selectAll("path")
        .data(mapFeatures)
        .join("path")
        .attr("class", "country-border")
        .attr("data-code", d => featureCodeCandidates(d).join(" "))
        .attr("data-slugs", d => slugsForFeature(d).join(" "))
        .attr("d", path);

      bindMapZoom(zoomLayer, mapFeatures);
      updateSelectionExport();
      updateMapImages();

      document.querySelector("#doc-panel").innerHTML = `
        <div class="placeholder">已加载 ${pages.count} 个本地抓取页面。点击地图上有页面的国家或地区，右侧会显示页面内容；地图可缩放。</div>
      `;
    }

    boot().catch(error => {
      document.querySelector("#doc-panel").innerHTML = `<div class="placeholder">加载失败：${escapeHtml(error.message)}</div>`;
    });
  </script>
</body>
</html>
